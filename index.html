<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caminatas Automatizado</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}.box{max-width:560px;margin:auto;background:white;padding:25px;border-radius:15px;box-shadow:0 2px 10px #bbb}
h1{text-align:center}.q{font-size:22px;font-weight:bold;margin:25px 0 15px}.r{min-height:60px;border:1px solid #ccc;border-radius:8px;padding:15px;font-size:19px}
button{width:100%;padding:15px;margin-top:15px;font-size:18px;border:0;border-radius:8px}.start{background:#2e7d32;color:white}.repeat{background:#1976d2;color:white}.stop{background:#777;color:white}.hide{display:none}
.state{text-align:center;font-weight:bold;margin:18px 0;min-height:25px}.item{padding:10px 0;border-bottom:1px solid #eee}
</style></head><body><div class="box">
<h1>🎙️ Caminatas Automatizado</h1><div id="state" class="state">Pulsa INICIAR</div>
<div id="q" class="q">Preparado</div><div id="r" class="r">Aquí aparecerá tu respuesta...</div>
<button id="start" class="start" onclick="start()">▶️ INICIAR CUESTIONARIO</button>
<button id="repeat" class="repeat hide" onclick="repeatQ()">🔊 REPETIR</button>
<button id="stop" class="stop hide" onclick="stopQ()">⏹️ DETENER</button>
<hr><b>Datos confirmados:</b><div id="list"></div>
</div>
<script>
const qs=[
 {c:"nombre",q:"¿Cuál es el nombre del paciente?",t:"text"},
 {c:"edad",q:"¿Cuál es la edad del paciente?",t:"num",min:1,max:120,u:"años"},
 {c:"peso",q:"¿Cuál es el peso del paciente en kilogramos?",t:"num",min:20,max:300,u:"kilogramos"}
];
let i=0,active=false,rec=null,mode="answer",pending=null,text="",timer=null,processing=false;

function st(x){state.innerText=x}
function start(){if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){st("❌ Chrome no admite voz");return}
 active=true;i=0;mode="answer";pending=null;processing=false;list.innerHTML="";
 start.classList.add("hide");repeat.classList.remove("hide");stop.classList.remove("hide");ask()}
function ask(){if(!active||i>=qs.length)return finish();mode="answer";pending=null;processing=false;text="";
 q.innerText=qs[i].q;r.innerText="Esperando respuesta...";speechSynthesis.cancel();
 let v=new SpeechSynthesisUtterance(qs[i].q);v.lang="es-CO";v.rate=.88;
 v.onstart=()=>st("🔊 Haciendo la pregunta...");
 v.onend=()=>{if(active){st("⏳ Prepárate...");setTimeout(listen,1200)}};speechSynthesis.speak(v)}
function listen(){if(!active||processing)return;let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 rec=new SR();rec.lang="es-CO";rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;text="";
 rec.onstart=()=>{st("🎙️ ESCUCHANDO... habla ahora");r.innerText="🎙️ Te escucho..."};
 rec.onresult=e=>{let p="";for(let n=e.resultIndex;n<e.results.length;n++){let z=e.results[n][0].transcript.trim();if(e.results[n].isFinal)text+=" "+z;else p+=" "+z}
 let show=(text+" "+p).trim();if(show)r.innerText=show;clearTimeout(timer);timer=setTimeout(()=>{if(rec)try{rec.stop()}catch(e){}},1400)};
 rec.onerror=e=>{if(e.error==="no-speech"&&!processing){st("⚠️ No detecté voz. Repito...");setTimeout(ask,700)}else if(e.error!=="aborted")st("❌ Error: "+e.error)};
 rec.onend=()=>{clearTimeout(timer);rec=null;if(active&&!processing){if(text.trim())answer(text.trim());else setTimeout(ask,700)}};
 try{rec.start()}catch(e){}}
function answer(x){if(processing)return;let p=qs[i],v=x;if(p.t==="num"){v=num(x);if(v===null||v<p.min||v>p.max){st("⚠️ El dato no es válido. Lo vuelvo a preguntar.");setTimeout(ask,1000);return}}
 pending=v;mode="confirm";processing=false;confirm()}
function confirm(){let p=qs[i],msg=p.t==="text"?"Entendí "+pending+". ¿Es correcto? Responde sí o no.":"Entendí "+pending+" "+p.u+". ¿Es correcto? Responde sí o no.";
q.innerText=msg;r.innerText=pending;st("🔎 Confirmando...");
speechSynthesis.cancel();let v=new SpeechSynthesisUtterance(msg);v.lang="es-CO";v.rate=.88;
v.onend=()=>{if(active){st("🎙️ Responde sí o no");setTimeout(listen,900)}};speechSynthesis.speak(v)}
function confirmAnswer(x){let s=x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
if(["si","correcto","correcta","exacto","exacta"].some(a=>s===a||s.startsWith(a+" "))){let p=qs[i];processing=true;add(p.q,pending+(p.u?" "+p.u:""));st("✅ Dato confirmado");setTimeout(()=>{i++;ask()},900)}
else if(["no","incorrecto","incorrecta"].some(a=>s===a||s.startsWith(a+" "))){processing=true;st("🔄 Repetimos el dato");setTimeout(ask,800)}
else{st("⚠️ Responde sí o no");processing=false;setTimeout(confirm,500)}}
const oldAnswer=answer;answer=function(x){if(mode==="confirm"){confirmAnswer(x);return}oldAnswer(x)}
function num(x){let s=x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/-/g," ").replace(/[.,]/g," ").replace(/\b(años?|anos?|kg|kilos?|kilogramos?)\b/g," ").replace(/\s+/g," ").trim();let d=s.match(/\d+(?:\.\d+)?/);if(d)return Number(d[0]);
let u={cero:0,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900,mil:1000};let a=0,t=0,ok=false;for(let w of s.split(" ")){if(w==="y")continue;if(u[w]===undefined)return null;ok=true;if(u[w]===1000){t+=(a||1)*1000;a=0}else a+=u[w]}return ok?t+a:null}
function add(a,b){let d=document.createElement("div");d.className="item";d.innerHTML="<b>"+a+"</b><br>"+b;list.appendChild(d)}
function repeatQ(){if(!active)return;if(rec)try{rec.abort()}catch(e){}speechSynthesis.cancel();processing=false;setTimeout(ask,300)}
function stopQ(){active=false;processing=true;speechSynthesis.cancel();if(rec)try{rec.abort()}catch(e){}rec=null;st("⏹️ Detenido")}
function finish(){active=false;processing=true;speechSynthesis.cancel();if(rec)try{rec.abort()}catch(e){}rec=null;q.innerText="✅ Preguntas terminadas";r.innerText="Todos los datos fueron confirmados.";st("🎉 Se terminaron y confirmaron todas las preguntas");repeat.classList.add("hide");stop.classList.add("hide");start.classList.remove("hide");start.innerText="🔄 NUEVA PRUEBA"}
</script></div></body></html>
