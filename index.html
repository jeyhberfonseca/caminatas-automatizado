<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caminatas Automatizado</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px}
.contenedor{max-width:560px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
h1{text-align:center;font-size:24px}
.pregunta{font-size:22px;font-weight:bold;margin:25px 0 15px}
.resultado{min-height:60px;border:1px solid #ccc;border-radius:8px;padding:15px;font-size:19px;background:#fafafa}
button{width:100%;padding:16px;margin-top:15px;font-size:18px;border:0;border-radius:8px;cursor:pointer}
.iniciar{background:#2e7d32;color:#fff}.repetir{background:#1976d2;color:#fff}.detener{background:#777;color:#fff}
.estado{text-align:center;font-weight:bold;margin:18px 0;min-height:25px}
.historial{margin-top:25px;border-top:1px solid #ddd;padding-top:15px}
.item{padding:10px 0;border-bottom:1px solid #eee}
.nota{font-size:14px;color:#555;margin-top:20px;line-height:1.5}
.oculto{display:none}
</style>
</head>
<body>
<div class="contenedor">
<h1>🎙️ Caminatas Automatizado</h1>
<div class="estado" id="estado">Pulsa INICIAR para comenzar</div>
<div class="pregunta" id="pregunta">Preparado</div>
<div class="resultado" id="resultado">Aquí aparecerá tu respuesta...</div>

<button class="iniciar" id="btnIniciar" onclick="iniciar()">▶️ INICIAR CUESTIONARIO</button>
<button class="repetir oculto" id="btnRepetir" onclick="repetirPregunta()">🔊 REPETIR PREGUNTA</button>
<button class="detener oculto" id="btnDetener" onclick="detener()">⏹️ DETENER</button>

<div class="historial">
<strong>Respuestas:</strong>
<div id="historial"></div>
</div>

<div class="nota">
La aplicación pregunta, espera a que termine de hablar, deja un pequeño silencio y luego escucha solamente tu respuesta.
</div>
</div>

<script>
const preguntas = [
  {campo:"nombre", texto:"¿Cuál es el nombre del paciente?"},
  {campo:"edad", texto:"¿Cuál es la edad del paciente?"},
  {campo:"peso", texto:"¿Cuál es el peso del paciente en kilogramos?"}
];

let indice = 0;
let respuestas = {};
let reconocimiento = null;
let activa = false;
let procesando = false;

function estado(texto){
  document.getElementById("estado").innerText = texto;
}

function iniciar(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    estado("❌ Este navegador no admite reconocimiento de voz.");
    return;
  }

  activa = true;
  procesando = false;
  indice = 0;
  respuestas = {};

  document.getElementById("btnIniciar").classList.add("oculto");
  document.getElementById("btnRepetir").classList.remove("oculto");
  document.getElementById("btnDetener").classList.remove("oculto");
  document.getElementById("historial").innerHTML = "";

  preguntar();
}

function preguntar(){
  if(!activa || indice >= preguntas.length){
    finalizar();
    return;
  }

  procesando = false;

  const texto = preguntas[indice].texto;

  document.getElementById("pregunta").innerText = texto;
  document.getElementById("resultado").innerText = "Escuchando tu respuesta después de la pregunta...";

  window.speechSynthesis.cancel();

  const voz = new SpeechSynthesisUtterance(texto);
  voz.lang = "es-CO";
  voz.rate = 0.9;
  voz.pitch = 1;

  voz.onstart = function(){
    estado("🔊 Haciendo la pregunta...");
  };

  voz.onend = function(){
    if(!activa) return;

    // Espera para evitar que el reconocimiento capture la propia pregunta.
    estado("⏳ Espera un momento...");
    setTimeout(function(){
      if(activa && !procesando){
        iniciarEscucha();
      }
    }, 1200);
  };

  window.speechSynthesis.speak(voz);
}

function iniciarEscucha(){
  if(!activa || procesando) return;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  reconocimiento = new SR();

  reconocimiento.lang = "es-CO";
  reconocimiento.continuous = false;
  reconocimiento.interimResults = false;
  reconocimiento.maxAlternatives = 1;

  reconocimiento.onstart = function(){
    estado("🎙️ ESCUCHANDO... HABLA AHORA");
    document.getElementById("resultado").innerText = "🎙️ Puedes responder...";
  };

  reconocimiento.onresult = function(event){
    if(procesando) return;

    const texto = event.results[0][0].transcript.trim();

    if(!texto) return;

    procesando = true;

    const pregunta = preguntas[indice];
    respuestas[pregunta.campo] = texto;

    document.getElementById("resultado").innerText = texto;
    agregarHistorial(pregunta.texto, texto);
    estado("✅ Respuesta capturada");

    if(reconocimiento){
      try{ reconocimiento.stop(); }catch(e){}
    }

    // Da tiempo para que termine de procesar antes de la siguiente pregunta.
    setTimeout(function(){
      if(!activa) return;

      indice++;

      if(indice >= preguntas.length){
        finalizar();
      }else{
        preguntar();
      }
    }, 1200);
  };

  reconocimiento.onerror = function(event){
    if(!activa || procesando) return;

    console.log("Error:", event.error);

    if(event.error === "no-speech"){
      estado("⚠️ No detecté respuesta. Volveré a preguntar.");
      setTimeout(preguntar, 1000);
      return;
    }

    if(event.error === "aborted") return;

    estado("❌ Error de voz: " + event.error);
  };

  reconocimiento.onend = function(){
    reconocimiento = null;
  };

  try{
    reconocimiento.start();
  }catch(error){
    console.log(error);
  }
}

function repetirPregunta(){
  if(!activa) return;

  if(reconocimiento){
    try{ reconocimiento.abort(); }catch(e){}
    reconocimiento = null;
  }

  window.speechSynthesis.cancel();
  procesando = false;

  setTimeout(preguntar, 300);
}

function detener(){
  activa = false;
  procesando = true;

  window.speechSynthesis.cancel();

  if(reconocimiento){
    try{ reconocimiento.abort(); }catch(e){}
    reconocimiento = null;
  }

  estado("⏹️ Cuestionario detenido");
}

function agregarHistorial(pregunta, respuesta){
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = "<strong>" + pregunta + "</strong><br>" + respuesta;
  document.getElementById("historial").appendChild(div);
}

function finalizar(){
  activa = false;
  procesando = true;

  window.speechSynthesis.cancel();

  if(reconocimiento){
    try{ reconocimiento.abort(); }catch(e){}
    reconocimiento = null;
  }

  document.getElementById("pregunta").innerText = "✅ Preguntas terminadas";
  document.getElementById("resultado").innerText = "La captura de datos ha finalizado correctamente.";
  estado("🎉 Se terminaron todas las preguntas");

  document.getElementById("btnRepetir").classList.add("oculto");
  document.getElementById("btnDetener").classList.add("oculto");
  document.getElementById("btnIniciar").classList.remove("oculto");
  document.getElementById("btnIniciar").innerText = "🔄 NUEVA PRUEBA";
}
</script>
</body>
</html>
