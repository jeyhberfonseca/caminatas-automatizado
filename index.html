<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caminatas Automatizado</title><style>body{font-family:Arial;background:#f4f6f8;padding:20px}.box{max-width:560px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 2px 10px #bbb}h1{text-align:center}.q{font-size:22px;font-weight:bold;margin:25px 0 15px}.r{min-height:60px;border:1px solid #ccc;border-radius:8px;padding:15px;font-size:19px}button{width:100%;padding:15px;margin-top:15px;font-size:18px;border:0;border-radius:8px}.start{background:#2e7d32;color:white}.repeat{background:#1976d2;color:white}.stop{background:#777;color:white}.hide{display:none}.state{text-align:center;font-weight:bold;margin:18px 0;min-height:25px}.item{padding:10px 0;border-bottom:1px solid #eee}</style></head><body><div class="box"><h1>🎙️ Caminatas Automatizado</h1><div id="estado" class="state">Pulsa INICIAR</div><div id="pregunta" class="q">Preparado</div><div id="respuesta" class="r">Aquí aparecerá tu respuesta...</div><button id="btnIniciar" class="start">▶️ INICIAR CUESTIONARIO</button><button id="btnRepetir" class="repeat hide">🔊 REPETIR</button><button id="btnDetener" class="stop hide">⏹️ DETENER</button><hr><b>Datos confirmados:</b><div id="lista"></div></div><script>const P=[{c:"nombre",q:"¿Cuál es el nombre del paciente?",t:"text"},{c:"edad",q:"¿Cuál es la edad del paciente?",t:"num",min:1,max:120,u:"años"},{c:"peso",q:"¿Cuál es el peso del paciente en kilogramos?",t:"num",min:20,max:300,u:"kilogramos"}];let i=0,on=false,rec=null,mode="a",txt="",pending=null,timer=null,busy=false;const E=id=>document.getElementById(id),st=x=>E("estado").textContent=x;function iniciar(){if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){st("❌ Usa Google Chrome para reconocimiento de voz.");return}on=true;i=0;busy=false;E("btnIniciar").classList.add("hide");E("btnRepetir").classList.remove("hide");E("btnDetener").classList.remove("hide");E("lista").innerHTML="";ask()}function ask(){if(!on)return;if(i>=P.length){finish();return}mode="a";busy=false;txt="";pending=null;let p=P[i];E("pregunta").textContent=p.q;E("respuesta").textContent="Esperando respuesta...";speechSynthesis.cancel();let v=new SpeechSynthesisUtterance(p.q);v.lang="es-CO";v.rate=.88;v.onstart=()=>st("🔊 Haciendo la pregunta...");v.onend=()=>{if(on){st("⏳ Prepárate para responder...");setTimeout(listen,1200)}};speechSynthesis.speak(v)}function listen(){if(!on||busy)return;let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;rec=new SR();rec.lang="es-CO";rec.continuous=true;rec.interimResults=true;txt="";rec.onstart=()=>st("🎙️ ESCUCHANDO... HABLA AHORA");rec.onresult=e=>{let tmp="";for(let n=e.resultIndex;n<e.results.length;n++){let x=e.results[n][0].transcript.trim();if(e.results[n].isFinal)txt+=" "+x;else tmp+=" "+x}E("respuesta").textContent=(txt+" "+tmp).trim()||"🎙️ Te escucho...";clearTimeout(timer);timer=setTimeout(()=>{try{rec.stop()}catch(e){}},1400)};rec.onerror=e=>{if(e.error!=="aborted")st(e.error==="no-speech"?"⚠️ No detecté voz. Repito...":"❌ Error de voz: "+e.error)};rec.onend=()=>{clearTimeout(timer);rec=null;if(!on||busy)return;if(!txt.trim()){setTimeout(ask,700);return}if(mode==="c")confirmAnswer(txt.trim());else answer(txt.trim())};try{rec.start()}catch(e){}}function answer(x){let p=P[i],v=x;if(p.t==="num"){v=num(x);if(v===null||v<p.min||v>p.max){st("⚠️ Dato no válido. Lo vuelvo a preguntar.");setTimeout(ask,900);return}}pending=v;mode="c";confirm()}function confirm(){let p=P[i],m=p.t==="text"?`Entendí ${pending}. ¿Es correcto? Responde sí o no.`:`Entendí ${pending} ${p.u}. ¿Es correcto? Responde sí o no.`;E("pregunta").textContent=m;E("respuesta").textContent=pending;speechSynthesis.cancel();let v=new SpeechSynthesisUtterance(m);v.lang="es-CO";v.rate=.88;v.onend=()=>{if(on){st("🎙️ Responde sí o no");setTimeout(listen,800)}};speechSynthesis.speak(v)}function confirmAnswer(x){
 let s=x.toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[¿?¡!.,;:]/g," ").replace(/\s+/g," ").trim();

 const yes=/^(si|correcto|correcta|exacto|exacta|afirmativo)(\s|$)/.test(s);
 const no=/^(no|incorrecto|incorrecta|negativo)(\s|$)/.test(s);

 if(yes){
   busy=true;
   let p=P[i];
   E("lista").insertAdjacentHTML("beforeend",`<div class="item"><b>${p.q}</b><br>${pending}${p.u?" "+p.u:""}</div>`);
   st("✅ Dato confirmado");
   setTimeout(()=>{
     i++;
     if(i>=P.length) finish();
     else ask();
   },900);
 }else if(no){
   busy=true;
   st("🔄 Repetimos la pregunta.");
   setTimeout(ask,800);
 }else{
   busy=false;
   st("⚠️ No entendí. Responde sí o no.");
   setTimeout(confirm,500);
 }
}
function num(x){let s=x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/-/g," ").replace(/[.,]/g," ").replace(/\b(años?|anos?|kg|kilos?|kilogramos?)\b/g," ").replace(/\s+/g," ").trim(),d=s.match(/\d+(?:\.\d+)?/);if(d)return Number(d[0]);let u={cero:0,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900,mil:1000},a=0,t=0;for(let w of s.split(" ")){if(w==="y")continue;if(u[w]===undefined)return null;u[w]===1000?(t+=(a||1)*1000,a=0):a+=u[w]}return t+a||null}function repeatQ(){if(!on)return;speechSynthesis.cancel();if(rec)try{rec.abort()}catch(e){}busy=false;setTimeout(ask,300)}function stopQ(){on=false;busy=true;speechSynthesis.cancel();if(rec)try{rec.abort()}catch(e){}rec=null;st("⏹️ Cuestionario detenido")}function finish(){on=false;busy=true;speechSynthesis.cancel();E("pregunta").textContent="✅ Preguntas terminadas";E("respuesta").textContent="Todos los datos fueron confirmados.";st("🎉 Se terminaron y confirmaron todas las preguntas");E("btnRepetir").classList.add("hide");E("btnDetener").classList.add("hide");E("btnIniciar").classList.remove("hide");E("btnIniciar").textContent="🔄 NUEVA PRUEBA"}E("btnIniciar").addEventListener("click",iniciar);E("btnRepetir").addEventListener("click",repeatQ);E("btnDetener").addEventListener("click",stopQ);</script></body></html>
